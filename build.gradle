plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('com.azure:azure-sdk-bom:1.3.7')
    implementation 'com.azure:azure-identity'
    implementation 'com.azure:azure-messaging-servicebus'
    implementation 'com.microsoft.sqlserver:mssql-jdbc:12.8.2.jre8'
}

configurations.all {
    resolutionStrategy {
        force 'io.netty:netty-codec:4.1.133.Final'
        force 'io.netty:netty-codec-http:4.1.133.Final'
        force 'io.netty:netty-codec-http2:4.1.133.Final'
        force 'io.netty:netty-codec-dns:4.1.133.Final'
        force 'io.netty:netty-handler-proxy:4.1.133.Final'
        force 'com.microsoft.azure:msal4j:1.15.1'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

application {
    mainClass = 'com.zavabank.fileingestion.Main'
}

tasks.register('shadowJar', Jar) {
    dependsOn classes
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
    from(sourceSets.main.output)
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
